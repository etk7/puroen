
{% extends "base.html" %}

{% block title %}グループ一覧{% endblock %}

{% block content %}
<h1>あなたのグループ一覧</h1>

{% if groups %}
    <ul>
    {% for group in groups %}
        <li>
            {{ group.name }}<br>
            <a href="{{ url_for('group_detail', group_id=group.id) }}" class="button-link">詳細を見る</a>
        </li>
    {% endfor %}
    </ul>
{% else %}
    <p>所属しているグループはありません。</p>
{% endif %}

<p><a href="{{ url_for('home') }}" class="button-link">ホームに戻る</a></p>
{% endblock %}
