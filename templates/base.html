<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}タイトル{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f9f9f9;
        }
        h1 {
            color: #333;
        }
        .button-container {
            margin-top: 20px;
        }
        .button-container form,
        .button-container a {
            display: inline-block;
            margin: 10px 10px 0 0;
        }
        button, a.button-link {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        a.button-link:hover, button:hover {
            background-color: #45a049;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input[type="text"], input[type="password"], input[type="email"], input[type="date"], input[type="number"] {
            padding: 8px;
            width: 100%;
            max-width: 300px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
