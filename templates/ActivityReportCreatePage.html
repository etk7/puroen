{% extends "base.html" %}

{% block title %}活動報告投稿{% endblock %}

{% block content %}
<h1>活動報告を投稿する</h1>

<form method="POST">
    <div class="form-group">
        <label for="group">グループ名：</label><br>
        <input type="text" name="group" required>
    </div>
    <div class="form-group">
        <label for="report">活動内容：</label><br>
        <textarea name="report" rows="8" maxlength="500" placeholder="500文字以内で記入してください" required></textarea>
    </div>
    <button type="submit">投稿</button>
</form>

{% if message %}
    <p style="color:red;">{{ message }}</p>
{% endif %}

<p><a href="{{ url_for('group_page') }}" class="button-link">グループ画面へ戻る</a></p>
{% endblock %}
