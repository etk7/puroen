{% extends "base.html" %}

{% block title %}プロフィール{% endblock %}

{% block content %}
<h1>{{ user.username }} さんのプロフィール</h1>
<ul>
    <li>メールアドレス：{{ user.email }}</li>
    <li>生年月日：{{ user.birthdate }}</li>
    <li>身長：{{ user.tall }} cm</li>
    <li>性別：{{ user.gender }}</li>
    <li>目標体重：{{ user.goalweight }} kg</li>
</ul>
<p><a href="{{ url_for('edit_profile') }}" class="button-link">アカウント情報変更</a></p>
<p><a href="{{ url_for('home') }}" class="button-link">ホームに戻る</a></p>
{% endblock %}
