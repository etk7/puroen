<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
</head>
<body>
    <h2>ログイン</h2>
    <form method="post">
        <label>ユーザー名: <input type="text" name="username" required></label><br>

        <button type="submit">ログイン</button>
    </form>
    <p style="color:red;">{{ message }}</p>
</body>
</html>
