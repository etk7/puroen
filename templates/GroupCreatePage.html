{% extends "base.html" %}

{% block title %}グループ作成{% endblock %}

{% block content %}
<h1>グループ作成</h1>
<form method="POST" action="{{ url_for('group_create') }}">
    <label for="group_name">グループ名：</label>
    <input type="text" name="group_name" required><br>

    <label for="description">説明：</label>
    <textarea name="description" rows="4"></textarea><br>

    <h3>グループに追加する友達：</h3>
    {% if friends %}
        {% for friend in friends %}
            <label>
                <input type="checkbox" name="members" value="{{ friend.id }}">
                {{ friend.username }}
            </label><br>
        {% endfor %}
    {% else %}
        <p>友達がいません。</p>
    {% endif %}

    <br>
    <button type="submit">作成</button>
</form>

<p><a href="{{ url_for('home') }}" class="button-link">ホームに戻る</a></p>
{% endblock %}
