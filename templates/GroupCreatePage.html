{% extends "base.html" %}

{% block title %}グループ作成{% endblock %}

{% block content %}
<h1>グループ作成</h1>

<form method="POST" action="{{ url_for('group_create') }}">
    <label for="group_name">グループ名：</label>
    <input type="text" name="group_name" id="group_name" required><br><br>

    <label for="description">説明：</label>
    <textarea name="description" id="description" rows="4" placeholder="グループの説明を入力してください"></textarea><br><br>

    <button type="submit">確認画面へ</button>
</form>

<p><a href="{{ url_for('home') }}" class="button-link">ホームに戻る</a></p>
{% endblock %}
