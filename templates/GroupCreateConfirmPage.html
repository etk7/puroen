{% extends "base.html" %}

{% block title %}グループ作成確認{% endblock %}

{% block content %}
<h1>グループ作成確認</h1>

<p>以下の内容でグループを作成しますか？</p>

<ul>
    <li><strong>グループ名：</strong> {{ group_name }}</li>
    <li><strong>説明：</strong> {{ description }}</li>
</ul>

<form method="POST" action="{{ url_for('confirm_group_creation') }}">
    <!-- 確認用に再送信 -->
    <input type="hidden" name="group_name" value="{{ group_name }}">
    <input type="hidden" name="description" value="{{ description }}">
    <button type="submit">作成を確定</button>
</form>

<p><a href="{{ url_for('group_create') }}" class="button-link">戻って修正</a></p>
{% endblock %}
