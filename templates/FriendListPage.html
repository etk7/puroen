{% extends "base.html" %}

{% block title %}友達一覧{% endblock %}

{% block content %}
<h1>友達一覧</h1>

{% if friends %}
    <ul>
        {% for friend in friends %}
            <li>
                {{ friend.username }}
                <form action="{{ url_for('friend_info', user_id=friend.id) }}" method="GET" style="display:inline;">
                    <button type="submit">プロフィールを見る</button>
                </form>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>友達がいません。</p>
{% endif %}

<p><a href="{{ url_for('home') }}" class="button-link">ホームに戻る</a></p>
{% endblock %}
