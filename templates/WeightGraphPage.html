<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>体重の推移グラフ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            margin: 30px;
            background-color: #f9f9f9;
        }

        h1 {
            color: #333;
        }

        canvas {
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4eb3d3;
            color: white;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            font-size: 16px;
        }

        .button:hover {
            background-color: #2b8cbe;
        }
    </style>
</head>
<body>
    <h1>体重の推移</h1>
    <canvas id="weightChart" width="400" height="200"></canvas>

    <script>
        const labels = {{ labels|tojson }};
        const weights = {{ weights|tojson }};

        const ctx = document.getElementById('weightChart').getContext('2d');
        const weightChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels, // 日付
                datasets: [{
                    label: '体重 (kg)',
                    data: weights, // 各日の体重
                    borderColor: 'rgba(75, 192, 192, 1)',
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    tension: 0.3
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: false,
                        title: {
                            display: true,
                            text: '体重 (kg)'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: '日付'
                        }
                    }
                }
            }
        });
    </script>

    <!-- ホームに戻るボタン（見た目を歩数カレンダーと統一） -->
    <a href="{{ url_for('home') }}" class="button">ホームに戻る</a>

</body>
</html>
