{% extends "base.html" %}

{% block title %}体重推移グラフ{% endblock %}

{% block content %}
<h1>体重推移グラフ（月別）</h1>

<canvas id="weightChart" width="800" height="400"></canvas>

<!-- ホームに戻るボタン -->
<form action="{{ url_for('HomePage') }}" method="get">
    <button type="submit" style="margin-top: 20px;">ホームに戻る</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const ctx = document.getElementById('weightChart').getContext('2d');
    const weightChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: {{ dates|tojson }},
            datasets: [{
                label: '体重 (kg)',
                data: {{ weights|tojson }},
                borderColor: 'rgba(75, 192, 192, 1)',
                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                fill: true,
                tension: 0.3,
                pointRadius: 4
            }]
        },
        options: {
            responsive: true,
            scales: {
                x: {
                    title: {
                        display: true,
                        text: '日付'
                    },
                    ticks: {
                        maxRotation: 90,
                        minRotation: 45
                    }
                },
                y: {
                    title: {
                        display: true,
                        text: '体重 (kg)'
                    },
                    beginAtZero: false
                }
            },
            plugins: {
                legend: {
                    display: true
                },
                tooltip: {
                    enabled: true
                }
            }
        }
    });
</script>
{% endblock %}
