{% extends "base.html" %}

{% block title %}1日の成果入力{% endblock %}

{% block content %}
<h1>1日の成果を入力する</h1>

<form method="POST">
    <div class="form-group">
        <label for="date">日付：</label><br>
        <input type="date" name="date" required>
    </div>
    <div class="form-group">
        <label for="steps">歩数：</label><br>
        <input type="number" name="steps" min="0" required>
    </div>
    <div class="form-group">
        <label for="weight">体重（kg）：</label><br>
        <input type="number" name="weight" step="0.1" min="0" required>
    </div>
    <button type="submit">保存</button>
</form>

{% if message %}
    <p style="color:red;">{{ message }}</p>
{% endif %}

<p><a href="{{ url_for('home') }}" class="button-link">ホームに戻る</a></p>
{% endblock %}
