<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ホーム</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f9f9f9;
        }
        h1 {
            color: #333;
        }
        .button-container {
            margin-top: 20px;
        }
        .button-container form,
        .button-container a {
            display: inline-block;
            margin: 10px 10px 0 0;
        }
        button, a.button-link {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        a.button-link:hover, button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>{{ username }}さん、ようこそ！</h1>

    <div class="button-container">
        <!-- 友達検索 -->
        <form action="{{ url_for('user_search') }}" method="get">
            <button type="submit">ユーザ検索</button>
        </form>

        <!-- 友達申請受信ボックス -->
        <form action="{{ url_for('friend_apply_recept') }}" method="get">
            <button type="submit">友達申請受信</button>
        </form>

        <!-- 友達リスト-->
        <a href="{{ url_for('friend_list') }}" class="button-link">友達リスト</a>

        <!-- 一日の成果入力-->
        <a href="{{ url_for('achievement_create') }}" class="button-link">一日の成果入力</a>
        
        <!--成果一覧-->
        <a href="{{ url_for('my_achievements') }}" class="button-link">成果一覧</a>
 
        <!--歩数カレンダー-->
        <a href="{{ url_for('step_calendar') }}" class="button-link">歩数カレンダー</a>

        <!-- 体重グラフページへのリンク -->
        <form action="{{ url_for('weight_graph') }}" method="get">
            <button type="submit">体重グラフ</button>
        </form>

        <!-- マイプロフィール -->
        <a href="{{ url_for('profile') }}" class="button-link">マイプロフィール</a>
        
        <!-- ログアウト -->
        <a href="{{ url_for('logout') }}" class="button-link">ログアウト</a>
    </div>

</body>
</html>
