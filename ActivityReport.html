<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>グループ活動報告</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2em;
            background-color: #f7f7f7;
        }

        h2 {
            color: #333;
        }

        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            width: 400px;
        }

        label {
            display: block;
            margin-top: 1em;
        }

        input[type="date"],
        input[type="text"],
        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 1em;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        button {
            margin-top: 1.5em;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h2>グループ活動報告</h2>

    <form method="POST">
        <label for="date">入力日</label>
        <input type="date" name="date" id="date" required>

        <label for="group_name">グループ名</label>
        <input type="text" name="group_name" id="group_name" required>

        <label for="content">活動報告内容</label>
        <textarea name="content" id="content" required placeholder="今日の活動内容を入力してください"></textarea>

        <button type="submit">投稿する</button>
    </form>

</body>
</html>
